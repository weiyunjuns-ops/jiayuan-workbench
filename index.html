<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFD700">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>家园沟通站</title>
  <style>
    body {
      margin: 0; background: #FFF8E1; color: #5D4037;
      font-family: -apple-system, "PingFang SC", sans-serif;
      padding-bottom: 70px;
    }
    .page { display: none; padding: 16px; }
    .page.active { display: block; }
    .card { background: #fff; border-radius: 16px; padding: 16px;
            margin-bottom: 12px; box-shadow: 0 2px 8px rgba(93,64,55,.08); }
    input, textarea, select {
      width: 100%; box-sizing: border-box; padding: 10px;
      border: 1px solid #E0C97F; border-radius: 10px; font-size: 16px;
      margin: 4px 0 12px; background: #FFFDF5;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: #FFD700; color: #5D4037; font-size: 16px; font-weight: bold;
    }
    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; background: #fff; border-top: 1px solid #eee;
    }
    .tabbar button { background: none; border-radius: 0; font-size: 13px; }
    .tabbar button.active { color: #FF8F00; }
  </style>
</head>
<body>
  <!-- 记录页（老师用） -->
  <div id="page-record" class="page active">
    <div class="card">
      <h3>📝 新记录</h3>
      <select id="r-child"></select>
      <select id="r-area">
        <option>建构区</option><option>美工区</option><option>角色区</option>
        <option>益智区</option><option>阅读区</option><option>科学区</option>
      </select>
      <textarea id="r-text" rows="4" placeholder="孩子说了什么？做了什么？"></textarea>
      <button onclick="saveRecord()">保存记录</button>
    </div>
    <div id="record-list"></div>
  </div>

  <!-- 周报页 -->
  <div id="page-report" class="page">
    <div class="card">
      <h3>📊 生成周报</h3>
      <select id="w-child"></select>
      <button onclick="genReport()">生成周报文字</button>
      <textarea id="w-out" rows="12" readonly></textarea>
      <button onclick="document.getElementById('w-out').select();
        document.execCommand('copy')">复制周报</button>
    </div>
  </div>

  <!-- 孩子管理页 -->
  <div id="page-kids" class="page">
    <div class="card">
      <h3>👶 添加孩子</h3>
      <input id="k-name" placeholder="孩子名字">
      <button onclick="addChild()">添加</button>
    </div>
    <div id="kid-list"></div>
  </div>

  <!-- 设置页（备份/导入/清空） -->
  <div id="page-settings" class="page">
    <div class="card">
      <h3>⚙️ 数据备份</h3>
      <p style="color:#A1887F;font-size:13px;margin:0 0 12px">
        数据只存在本机浏览器，建议每周导出一次备份。
      </p>
      <div id="settings-stats" style="color:#5D4037;font-size:14px;margin-bottom:12px"></div>
      <button onclick="exportBackup()">⬇️ 导出备份（JSON）</button>
      <div style="height:12px"></div>
      <label style="display:block">
        <input type="file" id="import-file" accept="application/json,.json" style="margin-bottom:8px">
      </label>
      <button onclick="importBackup()">⬆️ 导入备份</button>
    </div>
    <div class="card">
      <h3 style="color:#C62828">⚠️ 危险操作</h3>
      <p style="color:#A1887F;font-size:13px;margin:0 0 12px">
        清空将删除所有孩子和记录，且不可恢复。请先导出备份。
      </p>
      <button onclick="clearAll()" style="background:#EF5350;color:#fff">🗑 清空所有数据</button>
    </div>
  </div>

  <!-- 底部Tab -->
  <div class="tabbar">
    <button class="active" onclick="switchTab('record', this)">📝 记录</button>
    <button onclick="switchTab('report', this)">📊 周报</button>
    <button onclick="switchTab('kids', this)">👶 孩子</button>
    <button onclick="switchTab('settings', this)">⚙️ 设置</button>
  </div>

  <script>
    /* ============ B1-3: 注册 Service Worker（部署后生效） ============ */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')   // 注意：本地 file:// 打开无效，部署后生效
    }

    /* ============ B2 数据层：localStorage 存取模式 ============ */
    // 统一数据仓库：所有数据都在这一个key下
    const STORE_KEY = 'jiayuan-data'

    function load() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { children: [], records: [] } }
      catch (e) { return { children: [], records: [] } }
    }
    function save(db) { localStorage.setItem(STORE_KEY, JSON.stringify(db)) }

    // ---- 孩子 ----
    function addChild() {
      const name = document.getElementById('k-name').value.trim()
      if (!name) return alert('请输入名字')
      const db = load()
      db.children.push({ id: Date.now().toString(), name, createdAt: new Date().toISOString() })
      save(db)
      document.getElementById('k-name').value = ''
      renderAll()
    }
    // 仿写提示：删孩子 = db.children.filter(c => c.id !== id)，参考此模式写

    // ---- 记录 ----
    function saveRecord() {
      const childSel = document.getElementById('r-child')
      const db = load()
      db.records.push({
        id: Date.now().toString(),
        childId: childSel.value,
        childName: childSel.options[childSel.selectedIndex].text,
        area: document.getElementById('r-area').value,
        text: document.getElementById('r-text').value.trim(),
        date: new Date().toISOString().slice(0, 10)
      })
      save(db)
      document.getElementById('r-text').value = ''
      renderAll()
      alert('已保存 ✅')
    }

    // ---- 渲染（页面打开和每次改动后都调用）----
    function renderAll() {
      const db = load()
      // 填充两个下拉框
      const opts = db.children.map(c => `<option value="${c.id}">${c.name}</option>`).join('')
      document.getElementById('r-child').innerHTML = opts || '<option value="">（请先添加孩子）</option>'
      document.getElementById('w-child').innerHTML = opts
      // 今日记录列表
      const today = new Date().toISOString().slice(0, 10)
      document.getElementById('record-list').innerHTML = db.records
        .filter(r => r.date === today)
        .map(r => `<div class="card"><b>${r.childName}</b> · ${r.area}<br>${r.text}
                   <div style="color:#A1887F;font-size:12px">${r.date}</div></div>`)
        .reverse().join('') || '<div class="card">今天还没有记录</div>'
      // 孩子列表
      document.getElementById('kid-list').innerHTML = db.children
        .map(c => `<div class="card">${c.name}</div>`).join('') || ''
      // 设置页统计
      const stats = document.getElementById('settings-stats')
      if (stats) {
        const today = new Date().toISOString().slice(0, 10)
        const todayCount = db.records.filter(r => r.date === today).length
        stats.innerHTML = `👶 孩子 <b>${db.children.length}</b> 个　|　📝 记录 <b>${db.records.length}</b> 条　|　今日 <b>${todayCount}</b> 条`
      }
    }
    renderAll()

    /* ============ B3 周报生成：模板拼装（免费核心功能） ============ */
    function genReport() {
      const db = load()
      const childSel = document.getElementById('w-child')
      const childId = childSel.value
      if (!childId) return alert('请先添加并选择孩子')

      // 1. 取该孩子最近7天的记录
      const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10)
      const records = db.records.filter(r => r.childId === childId && r.date >= weekAgo)
      if (records.length === 0) return alert('这个孩子最近7天还没有记录')
      const childName = childSel.options[childSel.selectedIndex].text

      // 2. 按区域分组统计
      const byArea = {}
      records.forEach(r => { (byArea[r.area] = byArea[r.area] || []).push(r) })
      const areaLines = Object.entries(byArea)
        .sort((a, b) => b[1].length - a[1].length)
        .map(([area, rs]) => {
          const quote = rs[rs.length - 1].text.slice(0, 50)   // 抽最近一条做代表
          return `【${area}】本周参与 ${rs.length} 次。代表性表现：「${quote}…」`
        })

      // 3. 拼装周报
      const today = new Date().toISOString().slice(0, 10)
      const report =
    `🌟 ${childName} 本周成长周报
（${weekAgo} ~ ${today}）

本周共记录 ${records.length} 个精彩瞬间：

${areaLines.join('\n\n')}

💡 老师的话：
________________

如想了解更多细节，欢迎和老师交流～`

      document.getElementById('w-out').value = report
    }

    /* ============ 设置：导出 / 导入 / 清空（手册[291]自行补的功能） ============ */
    function exportBackup() {
      const db = load()
      const json = JSON.stringify(db, null, 2)
      const blob = new Blob([json], { type: 'application/json' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      const stamp = new Date().toISOString().slice(0, 10)
      a.href = url
      a.download = `jiayuan-backup-${stamp}.json`
      document.body.appendChild(a)
      a.click()
      document.body.removeChild(a)
      URL.revokeObjectURL(url)
      alert(`已导出 ${db.children.length} 个孩子、${db.records.length} 条记录`)
    }

    function importBackup() {
      const input = document.getElementById('import-file')
      const file = input.files[0]
      if (!file) return alert('请先选择备份文件')
      const reader = new FileReader()
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result)
          if (!Array.isArray(data.children) || !Array.isArray(data.records)) {
            return alert('备份文件格式不对：缺少 children 或 records 数组')
          }
          if (!confirm(`将导入 ${data.children.length} 个孩子、${data.records.length} 条记录。\n这会覆盖当前所有数据，确认继续？`)) return
          save(data)
          input.value = ''
          renderAll()
          alert('导入成功 ✅')
        } catch (err) {
          alert('解析失败：' + err.message)
        }
      }
      reader.readAsText(file)
    }

    function clearAll() {
      const db = load()
      if (db.children.length === 0 && db.records.length === 0) {
        return alert('当前没有数据，无需清空')
      }
      if (!confirm(`确认清空所有数据？\n（${db.children.length} 个孩子、${db.records.length} 条记录，不可恢复）\n建议先导出备份！`)) return
      if (!confirm('再次确认：真的要全部删掉吗？')) return
      save({ children: [], records: [] })
      renderAll()
      alert('已清空')
    }

    function switchTab(name, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
      document.getElementById('page-' + name).classList.add('active')
      document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
    }
  </script>
</body>
</html>
